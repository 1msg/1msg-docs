name: External links

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Weekly rather than on PRs: an external page (help.1msg.io articles not moved yet, Meta,
      # app stores) can break any day without anyone touching this repo, and must not block a PR.
      # A red run means a link to fix or replace; the report is in the run summary.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --include-fragments --no-progress './**/*.md'
